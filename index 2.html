<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LongDino Links</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ff;--sky1:#aee6f2;--sky2:#fff1c9;--h1:#a6e0a8;--h2:#6cc47f;--cloud:#ffffffcc;--sunc:#ffd84d;--mb:#010101;--ink:#1b1f4b;--card:#fff;--accent:#ff3d6e;--sun:#ffd84d;--shadow:#1b1f4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14163a;--ink:#f1f2ff;--card:#23265a;--shadow:#000;--sky1:#1b1f4b;--sky2:#5a3f86;--h1:#2f5a5c;--h2:#244a4a;--cloud:#ffffff30;--sunc:#f4f1d0;--mb:#f1f2ff}}
:root[data-theme="dark"]{--bg:#14163a;--ink:#f1f2ff;--card:#23265a;--shadow:#000;--sky1:#1b1f4b;--sky2:#5a3f86;--h1:#2f5a5c;--h2:#244a4a;--cloud:#ffffff30;--sunc:#f4f1d0;--mb:#f1f2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{display:flex;flex-direction:column;min-height:100vh;margin:0;background:linear-gradient(var(--sky1),var(--sky2)) fixed var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:500;line-height:1.5}
main{position:relative;z-index:1;width:100%;max-width:480px;flex:none;margin:0 auto;padding:40px 20px 24px;text-align:center}
.avatar{width:116px;height:116px;overflow:hidden;margin:0 auto 16px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font:2.4rem "Jua",sans-serif;color:#1b1f4b}
h1{font:2rem/1.2 "Jua","Noto Sans KR",sans-serif;margin:0 0 6px}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.live.off{background:#5d6190}.live.off i{animation:none;opacity:.6}
.next{margin:-4px 0 12px;font-weight:700;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
p.bio{margin:0 0 16px;font:1.8rem/1.3 "Jua","Noto Sans KR",sans-serif}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
a.btn{display:block;padding:16px 20px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:1.05rem;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
a.btn:hover,a.btn:focus-visible{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a.main{background:var(--accent);color:#fff}
small{display:block;margin-top:36px;opacity:.6}
.scene{position:fixed;left:0;width:100%;pointer-events:none;overflow:visible;z-index:0}
.scene.top{top:0;height:200px}.scene.bot{position:relative;flex:none;margin-top:auto;height:290px;overflow:hidden}
.cloud{fill:var(--cloud)}.sun{fill:var(--sunc)}.hl1{fill:var(--h1)}.hl2{fill:var(--h2)}
#theme{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#theme:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
#theme:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sched{margin:34px 0 24px;padding:16px 14px 18px;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--shadow)}
.sched-h{display:inline-block;margin:-34px 0 12px;padding:6px 18px;background:#010101;color:#fff;border-radius:999px;font-weight:900;font-size:1.25rem;text-shadow:-1.5px -1.5px 0 #25f4ee,1.5px 1.5px 0 #fe2c55}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.days span{padding:6px 0;border-radius:10px;font-size:.85rem;font-weight:900;border:2px solid transparent}
.days .on{background:#010101;color:#fff;box-shadow:-2px -2px 0 #25f4ee,2px 2px 0 #fe2c55}
.days .off{border:2px dashed var(--ink);opacity:.5}
.time{font-size:1.6rem;font-weight:900;line-height:1.3}
.note{font-size:1rem;font-weight:700;opacity:.75}
a.btn.main{padding:18px 20px;background:#010101;color:#fff;border-color:var(--mb);font-size:1.15rem;text-shadow:-1px -1px 0 #25f4ee,1px 1px 0 #fe2c55;box-shadow:-4px -4px 0 #25f4ee,4px 4px 0 #fe2c55}
a.btn.main:hover,a.btn.main:focus-visible{transform:translate(2px,2px);box-shadow:-2px -2px 0 #25f4ee,2px 2px 0 #fe2c55}
.dino{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.4s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.018)}}
.head{transform-origin:214px 108px;transition:transform 1.2s ease}
.eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye-closed,.zzz text{opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}25%,75%{opacity:1}100%{opacity:0;transform:translate(-8px,-12px)}}
:root[data-theme="dark"] .eye-open{opacity:0}
:root[data-theme="dark"] .eye-closed{opacity:1}
:root[data-theme="dark"] .head{transform:rotate(-14deg)}
:root[data-theme="dark"] .dino{animation-duration:6s}
:root[data-theme="dark"] .zzz text{animation:zz 3.6s ease-in-out infinite}
:root[data-theme="dark"] .zzz text:nth-child(2){animation-delay:1.2s}
:root[data-theme="dark"] .zzz text:nth-child(3){animation-delay:2.4s}
@media (prefers-reduced-motion:reduce){.dino,.eye-open,:root[data-theme="dark"] .zzz text{animation:none}:root[data-theme="dark"] .zzz text{opacity:1}}
a.btn.ig{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 20px;background:linear-gradient(90deg,#f58529 0%,#dd2a7b 35%,#8134af 70%,#515bd4 100%);color:#fff;font-size:1.15rem;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>

<script>
(function(){
var r=document.documentElement,b=document.getElementById('theme');
function apply(x){r.setAttribute('data-theme',x);b.textContent=x==='dark'?'☀️':'🌙';b.setAttribute('aria-label',x==='dark'?'Switch to day':'Switch to night');}
var t=null;try{t=localStorage.getItem('theme');}catch(e){}
if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
apply(t);
b.addEventListener('click',function(){
var n=r.getAttribute('data-theme')==='dark'?'light':'dark';apply(n);
try{localStorage.setItem('theme',n);}catch(e){}
});
})();
</script>
<script>
(function(){
var st=document.getElementById('status'),lab=st.querySelector('span'),nx=document.getElementById('next'),tt=document.getElementById('tt');
var H=3600000,OFF=9*H;
function isLive(now){var k=new Date(now+OFF),d=k.getUTCDay(),h=k.getUTCHours();return d>=1&&d<=5&&h>=5&&h<13;}
function nextStart(now){var k=new Date(now+OFF);
var base=Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate(),5)-OFF;
for(var i=0;i<8;i++){var ms=base+i*24*H,d=(k.getUTCDay()+i)%7;if(d>=1&&d<=5&&ms>now)return ms;}
return null;}
function fmt(ms){try{return new Date(ms).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZoneName:'short'});}catch(e){return '';}}
function update(){var now=Date.now();
if(isLive(now)){st.className='live';lab.textContent='TikTok LIVE';nx.hidden=true;tt.textContent='\u266a Watch me live on TikTok';}
else{st.className='live off';lab.textContent='Offline';var n=nextStart(now);nx.textContent=n?'Next live: '+fmt(n)+' (your time)':'';nx.hidden=!n;tt.textContent='\u266a Visit my TikTok';}
}
update();setInterval(update,60000);
})();
</script>
